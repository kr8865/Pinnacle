services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    # MONGO_URI comes from backend/.env (your existing Atlas cluster) —
    # intentionally NOT overridden here, so seeded data (admin/courses/students)
    # is available immediately instead of starting from an empty local database.
    ports:
      - "5003:5003"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SOCKET_URL: /
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  backend_uploads:
